      - name: Ensure built-in azan audio
        id: audio
        if: steps.patch.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee audio-fetch.log) 2>&1
          trap 'rc=$?; echo "AUDIO_STAGE_FAILED rc=$rc line=$LINENO command=$BASH_COMMAND"; exit $rc' ERR
          echo "AUDIO_CHECK" > .m9-stage
          mkdir -p app/src/main/res/raw

          validate_audio() {
            python3 - "$1" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(1)

          data = path.read_bytes()
          if len(data) < 500_000 or data[:4] != b"OggS":
              raise SystemExit(1)
          PY
          }

          ensure_audio() {
            path="$1"
            url="$2"

            if validate_audio "$path"; then
              echo "Existing built-in audio valid: $path"
              return
            fi

            echo "Built-in audio missing/invalid, downloading: $path"
            rm -f "$path"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3               --connect-timeout 20 --max-time 180               --output "$path" "$url"
            validate_audio "$path"
          }

          ensure_audio             app/src/main/res/raw/azan_builtin_subuh.ogg             "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_01_Fajr_Adhan.ogg"

          ensure_audio             app/src/main/res/raw/azan_builtin_normal.ogg             "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_02_Dhuhr_Adhan.ogg"

          echo 'Built-in azan audio validation: PASS'

      - name: Clean obsolete repository files
        id: cleanup
        if: steps.audio.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "REPO_CLEANUP" > .m9-stage

          CURRENT_WORKFLOW="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          CURRENT_WORKFLOW="${CURRENT_WORKFLOW%@*}"
          echo "Current workflow: $CURRENT_WORKFLOW"

          # M9.2 replaced 7 Hari with Doa. WeekScreen is now dead source.
          git rm -f --ignore-unmatch \
            app/src/main/java/app/nudroidlabs/waktusolat/ui/WeekScreen.kt

          # Remove build/generated files only if an older commit accidentally tracked them.
          git rm -r -f --ignore-unmatch .gradle build app/build
          git rm -f --ignore-unmatch \
            static-audit.log \
            unit-test.log \
            build.log \
            lint.log \
            build-diagnose.txt \
            junit-failures.txt \
            release-sha256.txt \
            m9-readiness.txt \
            unit-test-summary.txt \
            release-permissions.txt \
            release-badging.txt \
            debug-badging.txt \
            zipalign-check.txt \
            apksigner-check.txt \
            apk-size-top.txt \
            aab-size-top.txt \
            bundled-audio-size.txt \
            release-dependencies.txt \
            release-apk-path.txt \
            release-aab-path.txt \
            repo-cleanup-report.txt

          # Keep the current workflow, but remove our obsolete milestone workflows.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "$path" = "$CURRENT_WORKFLOW" ] && continue

            base="$(basename "$path")"
            case "$base" in
              m1-*.yml|m2-*.yml|m3-*.yml|m4-*.yml|m5-*.yml|m6-*.yml|m7-*.yml|m8-*.yml|m8.4-*.yml|m84-*.yml|m9-*.yml|m9.1-*.yml|m9.2-*.yml|m91-*.yml|m92-*.yml)
                echo "Removing obsolete workflow: $path"
                git rm -f --ignore-unmatch -- "$path"
                ;;
              m1-*.yaml|m2-*.yaml|m3-*.yaml|m4-*.yaml|m5-*.yaml|m6-*.yaml|m7-*.yaml|m8-*.yaml|m8.4-*.yaml|m84-*.yaml|m9-*.yaml|m9.1-*.yaml|m9.2-*.yaml|m91-*.yaml|m92-*.yaml)
                echo "Removing obsolete workflow: $path"
                git rm -f --ignore-unmatch -- "$path"
                ;;
            esac
          done < <(git ls-files '.github/workflows/*')

          # If v2 is uploaded under a new filename, remove the old M10 workflow too.
          OLD_M10=".github/workflows/m10-final-release-build.yml"
          if [ "$CURRENT_WORKFLOW" != "$OLD_M10" ]; then
            git rm -f --ignore-unmatch -- "$OLD_M10"
          fi

          # Remove superseded self-updater workflows while preserving this run.
          for old_updater in             ".github/workflows/m101-self-updater-build.yml"             ".github/workflows/m101-self-updater-build-v2.yml"; do
            if [ "$CURRENT_WORKFLOW" != "$old_updater" ]; then
              git rm -f --ignore-unmatch -- "$old_updater"
            fi
          done

          # Prevent CI outputs/build folders from being committed later.
          touch .gitignore
          if ! grep -q '^# WSK CI generated outputs$' .gitignore; then
            cat >> .gitignore <<'EOF'

          # WSK CI generated outputs
          .gradle/
          build/
          app/build/
          *.log
          .m9-stage
          build-diagnose.txt
          junit-failures.txt
          release-sha256.txt
          m9-readiness.txt
          unit-test-summary.txt
          release-permissions.txt
          release-badging.txt
          debug-badging.txt
          zipalign-check.txt
          apksigner-check.txt
          apk-size-top.txt
          aab-size-top.txt
          bundled-audio-size.txt
          release-dependencies.txt
          release-apk-path.txt
          release-aab-path.txt
          repo-cleanup-report.txt
          EOF
          fi

          {
            echo 'WAKTU SOLAT & KIBLAT REPOSITORY CLEANUP'
            echo '======================================='
            echo
            echo 'Known obsolete/generated tracked paths staged for deletion:'
            git diff --cached --name-status --diff-filter=D || true
            echo
            echo 'Current workflow preserved:'
            echo "$CURRENT_WORKFLOW"
          } > repo-cleanup-report.txt

          cat repo-cleanup-report.txt


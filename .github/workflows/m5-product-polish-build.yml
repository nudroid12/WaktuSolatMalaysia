name: M5 Product Polish Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m5-product-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "PRECHECK" > .m5-stage

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/location/JakimZoneResolver.kt

          grep -q 'applicationId = "app.nudroidlabs.waktusolat"' app/build.gradle.kts
          grep -Eq 'versionCode = (2|3|4|5)' app/build.gradle.kts

      - name: Apply complete M5 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "APPLY_PATCH" > .m5-stage


      - name: Set up JDK 17
        id: java
        if: steps.audit.outcome == 'success'
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        id: android
        if: steps.java.outcome == 'success'
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Prepare Android API 37 platform
        id: sdk
        if: steps.android.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "ANDROID_SDK" > .m9-stage

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

          PLATFORM_DIR=""
          for candidate in android-37.0 android-37; do
            if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
              PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
              break
            fi
          done

          if [ -z "$PLATFORM_DIR" ]; then
            PACKAGE="$({ sdkmanager --list || true; } | awk -F'|' '
              /platforms;android-37([.]0)?[[:space:]]*[|]/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                print $1
                exit
              }
            ')"
            if [ -z "$PACKAGE" ]; then
              echo 'ERROR: No installable Android API 37 platform found.'
              ls -1 "$ANDROID_HOME/platforms" || true
              exit 1
            fi
            sdkmanager "$PACKAGE"

            for candidate in android-37.0 android-37; do
              if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
                PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
                break
              fi
            done
          fi

          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Using Android platform: $PLATFORM_DIR"

      - name: Set up Gradle 9.4.1
        id: gradle
        if: steps.sdk.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '9.4.1'

      - name: Prepare optional release signing
        id: signing
        if: steps.gradle.outcome == 'success'
        shell: bash
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "SIGNING_PREP" > .m9-stage

          present=0
          [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && present=$((present + 1))
          [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && present=$((present + 1))
          [ -n "${RELEASE_KEY_ALIAS:-}" ] && present=$((present + 1))
          [ -n "${RELEASE_KEY_PASSWORD:-}" ] && present=$((present + 1))

          if [ "$present" -eq 0 ]; then
            echo "M9_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
            echo "No release signing secrets found. RC will be built unsigned."
          elif [ "$present" -ne 4 ]; then
            echo "ERROR: release signing secrets are only partially configured."
            echo "Set all four or none:"
            echo "  RELEASE_KEYSTORE_BASE64"
            echo "  RELEASE_KEYSTORE_PASSWORD"
            echo "  RELEASE_KEY_ALIAS"
            echo "  RELEASE_KEY_PASSWORD"
            exit 1
          else
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/wsk-release.jks
            test -s /tmp/wsk-release.jks

            echo "ANDROID_KEYSTORE_PATH=/tmp/wsk-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "M9_SIGNING_MODE=signed" >> "$GITHUB_ENV"
            echo "Release signing material prepared without printing secrets."
          fi

      - name: Capture release dependencies
        id: dependencies
        if: steps.signing.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "DEPENDENCY_AUDIT" > .m9-stage
          gradle --no-daemon -q :app:dependencies             --configuration releaseRuntimeClasspath             > release-dependencies.txt 2>&1

      - name: Unit tests
        id: unit
        if: steps.dependencies.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "UNIT_TESTS" > .m9-stage
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Compile debug and release variants
        id: build
        if: steps.unit.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "COMPILE_VARIANTS" > .m9-stage
          gradle --no-daemon --stacktrace             :app:assembleDebug             :app:assembleRelease             :app:bundleRelease             2>&1 | tee build.log

      - name: Lint debug and release variants
        id: lint
        if: steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "LINT_VARIANTS" > .m9-stage
          gradle --no-daemon --stacktrace :app:lintDebug :app:lintRelease 2>&1 | tee lint.log

      - name: M10 release hardening audit
        id: hardening
        if: steps.lint.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "HARDENING_AUDIT" > .m9-stage

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          test -s "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          test -s "$RELEASE_AAB"
          test -f app/build/reports/lint-results-debug.html
          test -f app/build/reports/lint-results-release.html

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$AAPT" dump badging "$DEBUG_APK" > debug-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" > release-badging.txt
          "$AAPT" dump permissions "$RELEASE_APK" > release-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' release-permissions.txt

          grep -q "package: name='app.nudroidlabs.waktusolat'" debug-badging.txt
          grep -q "versionName='1.0.0'" debug-badging.txt
          grep -q "targetSdkVersion:'37'" debug-badging.txt
          grep -q "package: name='app.nudroidlabs.waktusolat'" release-badging.txt
          grep -q "versionName='1.0.0'" release-badging.txt
          grep -q "targetSdkVersion:'37'" release-badging.txt

          if grep -Ei 'ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|RECEIVE_SMS|READ_PHONE_STATE|CALL_PHONE|RECORD_AUDIO|CAMERA|MANAGE_EXTERNAL_STORAGE' release-permissions.txt; then
            echo 'ERROR: unexpected high-risk permission found in merged release APK.'
            exit 1
          fi

          "$ZIPALIGN" -c -P 16 -v 4 "$RELEASE_APK" > zipalign-check.txt

          if "$APKSIGNER" verify --verbose "$RELEASE_APK" > apksigner-check.txt 2>&1; then
            echo "Release APK signature verification: PASS" >> apksigner-check.txt
            DETECTED_SIGNING="signed"
          else
            if [ "${M9_SIGNING_MODE:-unsigned}" = "signed" ]; then
              echo "ERROR: signing secrets were supplied but release APK did not verify."
              cat apksigner-check.txt
              exit 1
            fi
            echo "Unsigned RC expected because no release signing secrets were configured." > apksigner-check.txt
            DETECTED_SIGNING="unsigned"
          fi

          sha256sum "$DEBUG_APK" "$RELEASE_APK" "$RELEASE_AAB" > release-sha256.txt

          python3 - "$RELEASE_APK" "$RELEASE_AAB" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk_path = Path(sys.argv[1])
          aab_path = Path(sys.argv[2])

          def report(path: Path, out_name: str):
              with zipfile.ZipFile(path) as z:
                  rows = []
                  total_uncompressed = 0
                  total_compressed = 0
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      total_uncompressed += info.file_size
                      total_compressed += info.compress_size
                      rows.append(
                          (info.file_size, info.compress_size, info.filename)
                      )

              rows.sort(reverse=True)
              lines = [
                  f"FILE: {path}",
                  f"ARCHIVE_BYTES: {path.stat().st_size}",
                  f"TOTAL_ENTRY_UNCOMPRESSED_BYTES: {total_uncompressed}",
                  f"TOTAL_ENTRY_COMPRESSED_BYTES: {total_compressed}",
                  "",
                  "TOP 40 ENTRIES BY UNCOMPRESSED SIZE",
                  "-----------------------------------",
              ]
              for uncompressed, compressed, name in rows[:40]:
                  lines.append(
                      f"{uncompressed:12d}  {compressed:12d}  {name}"
                  )

              Path(out_name).write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          report(apk_path, "apk-size-top.txt")
          report(aab_path, "aab-size-top.txt")
          PY

          {
            echo 'BUILT-IN AUDIO SOURCE FILES'
            echo '==========================='
            find app/src/main/res/raw -maxdepth 1 -type f -printf '%s  %f\n'               2>/dev/null | sort -nr || true
          } > bundled-audio-size.txt

          DEBUG_BYTES=$(stat -c%s "$DEBUG_APK")
          RELEASE_APK_BYTES=$(stat -c%s "$RELEASE_APK")
          RELEASE_AAB_BYTES=$(stat -c%s "$RELEASE_AAB")

          {
            echo 'WAKTU SOLAT & KIBLAT M10 FINAL RELEASE'
            echo '========================================='
            echo
            echo 'Version: 1.0.0'
            echo 'Version code: 18'
            echo 'Application ID: app.nudroidlabs.waktusolat'
            echo 'Target SDK: 37'
            echo 'Min SDK: 26'
            echo 'Feature freeze: YES'
            echo 'R8 minification: ENABLED'
            echo 'Resource shrinking: ENABLED'
            echo "Signing mode: $DETECTED_SIGNING"
            echo 'Debug unit tests: PASS'
            echo 'Debug APK build: PASS'
            echo 'Release APK build: PASS'
            echo 'Release AAB build: PASS'
            echo 'Debug lint: PASS'
            echo 'Release lint: PASS'
            echo 'Permission denylist audit: PASS'
            echo 'Background-location audit: PASS'
            echo 'APK zip alignment: PASS'
            echo 'APK content size analysis: PASS'
            echo 'AAB content size analysis: PASS'
            echo 'Release dependency capture: PASS'
            echo 'Continuous background GPS: NOT DETECTED'
            echo 'Explicit wake lock: NOT DETECTED'
            echo 'Prayer refresh cadence static audit: 24 HOURS'
            echo "Debug APK bytes: $DEBUG_BYTES"
            echo "Release APK bytes: $RELEASE_APK_BYTES"
            echo "Release AAB bytes: $RELEASE_AAB_BYTES"
            echo
            echo 'APK/AAB size is informational only and is not a release gate.'
          } > m9-readiness.txt

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          summaries = []
          total_tests = total_failures = total_errors = total_skipped = 0

          variant = "testDebugUnitTest"
          files = sorted(Path(f"app/build/test-results/{variant}").glob("TEST-*.xml"))
          tests = failures = errors = skipped = 0
          for file in files:
              root = ET.parse(file).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          if not files or failures or errors:
              raise SystemExit(
                  f"{variant} report not clean: files={len(files)} failures={failures} errors={errors}"
              )

          summaries.append(
              f"{variant}: tests={tests} failures={failures} errors={errors} skipped={skipped}"
          )
          total_tests += tests
          total_failures += failures
          total_errors += errors
          total_skipped += skipped

          summaries.append(
              f"TOTAL: tests={total_tests} failures={total_failures} errors={total_errors} skipped={total_skipped}"
          )
          Path("unit-test-summary.txt").write_text(
              "\n".join(summaries) + "\n",
              encoding="utf-8"
          )
          PY

          printf '%s\n' "$RELEASE_APK" > release-apk-path.txt
          printf '%s\n' "$RELEASE_AAB" > release-aab-path.txt

          cat unit-test-summary.txt
          cat m9-readiness.txt
          cat release-permissions.txt

      - name: Verify M10 outputs
        id: verify
        if: steps.hardening.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "VERIFY_OUTPUT" > .m9-stage
          RELEASE_APK="$(cat release-apk-path.txt)"
          RELEASE_AAB="$(cat release-aab-path.txt)"
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"
          test -s m9-readiness.txt
          test -s release-sha256.txt
          test -s release-permissions.txt
          test -s zipalign-check.txt
          test -s apksigner-check.txt
          test -s apk-size-top.txt
          test -s aab-size-top.txt
          test -s bundled-audio-size.txt
          test -s release-dependencies.txt

      - name: Commit M10.1 updater v2 after full success
        id: commit
        if: steps.verify.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "COMMIT" > .m9-stage
          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          # CI reports/build outputs are ignored by the cleanup step, so -A stages
          # product source, .gitignore and intentional obsolete-file deletions only.
          if git diff --cached --quiet; then
            echo 'M10.1 updater source is already committed.'
          else
            git commit -m "Add verified in-app updater before final signing"
            git push origin HEAD:main
          fi

      - name: Upload M10.1 updater v2 artifacts
        id: success_upload
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Waktu-Solat-Kiblat-1.0.0-M10.1-Updater-v2
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
            release-sha256.txt
            m9-readiness.txt
            unit-test-summary.txt
            release-permissions.txt
            release-badging.txt
            zipalign-check.txt
            apksigner-check.txt
            apk-size-top.txt
            aab-size-top.txt
            bundled-audio-size.txt
            release-dependencies.txt
            repo-cleanup-report.txt
            update.json
            SELF_UPDATE.md
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 21

      - name: Create detailed failure diagnostic
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.cleanup.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.dependencies.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        shell: bash
        run: |
          set +e
          STAGE="$(cat .m9-stage 2>/dev/null || echo UNKNOWN)"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          out = []
          files = sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              out.append('No JUnit XML files were produced.')
          for file in files:
              try:
                  root = ET.parse(file).getroot()
              except Exception as exc:
                  out.append(f'Could not parse {file}: {exc}')
                  continue
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  problem = failure if failure is not None else error
                  if problem is not None:
                      out.append(f"FAILED: {case.attrib.get('classname')} > {case.attrib.get('name')}")
                      message = problem.attrib.get('message')
                      if message:
                          out.append(f'MESSAGE: {message}')
                      text = (problem.text or '').strip()
                      if text:
                          out.extend(text.splitlines()[:80])
                      out.append('')
          Path('junit-failures.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          {
            echo 'WAKTU SOLAT & KIBLAT M9 v4 BUILD DIAGNOSE'
            echo '======================================'
            echo
            echo 'RESULT: FAILED'
            echo "LAST STAGE: $STAGE"
            echo
            echo 'STEP OUTCOMES'
            echo '-------------'
            echo "precheck=${{ steps.precheck.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "java=${{ steps.java.outcome }}"
            echo "android=${{ steps.android.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "unit=${{ steps.unit.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "hardening=${{ steps.hardening.outcome }}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "commit=${{ steps.commit.outcome }}"
            echo "success_upload=${{ steps.success_upload.outcome }}"
            echo
            echo 'BUILD CONFIG'
            echo '------------'
            grep -nE 'compileSdk|targetSdk|versionCode|versionName|warningsAsErrors' app/build.gradle.kts 2>/dev/null || true
            echo
            echo 'STATIC AUDIT LOG'
            echo '----------------'
            cat static-audit.log 2>/dev/null || true
            echo
            echo 'JUNIT FAILURES'
            echo '--------------'
            cat junit-failures.txt 2>/dev/null || true
            echo
            echo 'UNIT TEST ERROR CANDIDATES'
            echo '--------------------------'
            grep -nEi 'FAILED|AssertionError|expected|actual|Exception|FAILURE:|What went wrong|Execution failed' unit-test.log 2>/dev/null | tail -n 200 || true
            echo
            echo 'COMPILE ERROR CANDIDATES'
            echo '------------------------'
            for log in unit-test.log build.log lint.log; do
              if [ -f "$log" ]; then
                echo "[$log]"
                grep -nEi '(^e: |error:|FAILURE:|What went wrong|Execution failed|Unresolved reference|Cannot infer type|Compilation error|compileDebugKotlin|compileReleaseKotlin|Manifest merger failed|Could not resolve|Could not find)' "$log" | tail -n 220 || true
              fi
            done
            echo
            echo 'LINT ERROR CANDIDATES'
            echo '---------------------'
            grep -nEi 'error:|warning:|Lint found|ObsoleteSdkInt|MissingPermission|NewApi|ExpiredTargetSdkVersion' lint.log 2>/dev/null | tail -n 260 || true
            echo
            echo 'LAST UNIT TEST LOG'
            echo '------------------'
            tail -n 180 unit-test.log 2>/dev/null || true
            echo
            echo 'LAST BUILD LOG'
            echo '--------------'
            tail -n 180 build.log 2>/dev/null || true
            echo
            echo 'FULL LINT TEXT REPORTS'
            echo '----------------------'
            find app/build/intermediates -type f               -path '*lint*' -name 'lint-results-*.txt' -print 2>/dev/null |
              while IFS= read -r report; do
                echo
                echo "===== $report ====="
                cat "$report"
              done || true
            echo

            echo 'LAST LINT LOG'
            echo '-------------'
            tail -n 220 lint.log 2>/dev/null || true
          } > build-diagnose.txt

          cat build-diagnose.txt

      - name: Upload M10 failure diagnostic
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.cleanup.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.dependencies.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Kiblat-M9-v4-build-diagnose
          path: |
            build-diagnose.txt
            static-audit.log
            junit-failures.txt
            unit-test.log
            build.log
            lint.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.txt
            app/build/reports/lint-results-release.html
            debug-badging.txt
            release-badging.txt
            m9-readiness.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if any M10 gate failed
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.cleanup.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.dependencies.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        shell: bash
        run: exit 1

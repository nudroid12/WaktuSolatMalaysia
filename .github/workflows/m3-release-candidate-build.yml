name: M3 Release Candidate Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m3-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck M2 baseline
        id: precheck
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'applicationId = "app.nudroidlabs.waktusolat"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts

      - name: Diagnose precheck failure
        if: steps.precheck.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M3 DIAGNOSE"
            echo "================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: PRECHECK M2 BASELINE"
            echo
            echo "APP BUILD FILE"
            echo "--------------"
            cat app/build.gradle.kts 2>/dev/null || true
            echo
            echo "GIT STATUS"
            echo "----------"
            git status --short || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload precheck diagnostic
        if: steps.precheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M3-build-diagnose
          path: build-diagnose.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stop on precheck failure
        if: steps.precheck.outcome == 'failure'
        run: exit 1

      - name: Apply M3 release candidate patch
        shell: bash
        run: |
          set -euo pipefail

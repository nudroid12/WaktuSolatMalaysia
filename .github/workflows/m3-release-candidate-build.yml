          python3 - <<'PY2'
          from pathlib import Path
          import zipfile

          archive = Path('/tmp/wsm-m3.zip')
          with zipfile.ZipFile(archive) as z:
              unsafe = [
                  name for name in z.namelist()
                  if name.startswith('/') or '..' in Path(name).parts
              ]
              if unsafe:
                  raise SystemExit(f'Unsafe archive paths: {unsafe}')
              z.extractall('.')
          PY2

      - name: Normalise text files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path

          allowed = {'.md', '.kt', '.kts', '.xml', '.properties', '.txt', '.json', '.yml', '.yaml'}
          roots = [Path('README.md'), Path('app')]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(p for p in root.rglob('*') if p.is_file())

          for path in files:
              if path.suffix.lower() not in allowed and path.name != 'README.md':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              had_final_newline = text.endswith('\n')
              fixed = '\n'.join(line.rstrip(' \t') for line in text.splitlines())
              if had_final_newline:
                  fixed += '\n'
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
          PY2

      - name: Validate M3 source
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          grep -q 'versionCode = 3' app/build.gradle.kts
          grep -q 'versionName = "0.3.0"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'app.nudroidlabs.waktusolat' app/build.gradle.kts

          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="mediaPlayback"' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          if grep -q 'ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml; then
            echo "ERROR: Background location permission must not be present."
            exit 1
          fi

          test -f app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPreferences.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaCalculator.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaSensor.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/HomeScreen.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WeekScreen.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          test -f app/src/test/java/app/nudroidlabs/waktusolat/qibla/QiblaCalculatorTest.kt

          grep -q 'unregisterListener' app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaSensor.kt
          grep -q 'SensorManager.SENSOR_DELAY_UI' app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaSensor.kt
          grep -q '24,' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          grep -q 'MAX_PLAYBACK_MS = 10 \* 60 \* 1000L' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo "ERROR: Invalid Compose weight import found."
            exit 1
          fi
          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found."
            exit 1
          fi

          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(path)
          ET.parse('app/src/main/AndroidManifest.xml')
          print('XML parse passed')
          PY2

          git diff --check

      - name: Diagnose validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M3 DIAGNOSE"
            echo "================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: STATIC VALIDATION"
            echo
            echo "PROJECT CONFIG"
            echo "--------------"
            grep -nE 'compileSdk|targetSdk|versionCode|versionName' app/build.gradle.kts || true
            echo
            echo "MANIFEST CORE"
            echo "-------------"
            grep -nE 'FOREGROUND_SERVICE|SCHEDULE_EXACT_ALARM|POST_NOTIFICATIONS|ACCESS_BACKGROUND_LOCATION|mediaPlayback' app/src/main/AndroidManifest.xml || true
            echo
            echo "BAD COMPOSE IMPORT CHECK"
            echo "------------------------"
            grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java || true
            echo
            echo "GIT DIFF CHECK"
            echo "--------------"
            git diff --check || true
            echo
            echo "GIT STATUS"
            echo "----------"
            git status --short || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload validation diagnostic
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M3-build-diagnose
          path: build-diagnose.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stop on validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Test build and lint M3
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            2>&1 | tee build-full.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Create Gradle diagnostic
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M3 BUILD DIAGNOSE"
            echo "======================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: TEST BUILD OR LINT"
            echo "BUILD EXIT CODE: ${{ steps.build.outputs.exit_code }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            grep -nEi \
              '(^e: |error:|FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred|Caused by:|Unresolved reference|Compilation error|Manifest merger failed|Duplicate class|Lint found|Fatal:)' \
              build-full.log | tail -n 220 || true
            echo
            echo "LAST 320 LOG LINES"
            echo "------------------"
            tail -n 320 build-full.log || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload Gradle diagnostic
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M3-build-diagnose
          path: |
            build-diagnose.txt
            build-full.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop if M3 failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Commit M3 only after successful verification
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md app
          if git diff --cached --quiet; then
            echo "M3 source is already committed."
          else
            git commit -m "Add Waktu Solat Malaysia 0.3.0 release candidate"
            git push origin HEAD:main
          fi

      - name: Upload M3 APK and lint report
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-0.3.0-RC-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

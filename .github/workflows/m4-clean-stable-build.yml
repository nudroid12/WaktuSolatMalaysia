name: M4 Clean Stable Build v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m4-clean-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "PRECHECK" > .m4-stage

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/RescheduleReceiver.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/location/JakimZoneResolver.kt

          grep -q 'applicationId = "app.nudroidlabs.waktusolat"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -Eq 'versionCode = (2|3)' app/build.gradle.kts


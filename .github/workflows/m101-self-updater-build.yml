          PY

      - name: Clean obsolete repository files
        id: cleanup
        if: steps.precheck.outcome == 'success' && steps.patch.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "REPO_CLEANUP" > .m9-stage

          CURRENT_WORKFLOW="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          CURRENT_WORKFLOW="${CURRENT_WORKFLOW%@*}"
          echo "Current workflow: $CURRENT_WORKFLOW"

          # M9.2 replaced 7 Hari with Doa. WeekScreen is now dead source.
          git rm -f --ignore-unmatch \
            app/src/main/java/app/nudroidlabs/waktusolat/ui/WeekScreen.kt

          # Remove build/generated files only if an older commit accidentally tracked them.
          git rm -r -f --ignore-unmatch .gradle build app/build
          git rm -f --ignore-unmatch \
            static-audit.log \
            unit-test.log \
            build.log \
            lint.log \
            build-diagnose.txt \
            junit-failures.txt \
            release-sha256.txt \
            m9-readiness.txt \
            unit-test-summary.txt \
            release-permissions.txt \
            release-badging.txt \
            debug-badging.txt \
            zipalign-check.txt \
            apksigner-check.txt \
            apk-size-top.txt \
            aab-size-top.txt \
            bundled-audio-size.txt \
            release-dependencies.txt \
            release-apk-path.txt \
            release-aab-path.txt \
            repo-cleanup-report.txt

          # Keep the current workflow, but remove our obsolete milestone workflows.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "$path" = "$CURRENT_WORKFLOW" ] && continue

            base="$(basename "$path")"
            case "$base" in
              m1-*.yml|m2-*.yml|m3-*.yml|m4-*.yml|m5-*.yml|m6-*.yml|m7-*.yml|m8-*.yml|m8.4-*.yml|m84-*.yml|m9-*.yml|m9.1-*.yml|m9.2-*.yml|m91-*.yml|m92-*.yml)
                echo "Removing obsolete workflow: $path"
                git rm -f --ignore-unmatch -- "$path"
                ;;
              m1-*.yaml|m2-*.yaml|m3-*.yaml|m4-*.yaml|m5-*.yaml|m6-*.yaml|m7-*.yaml|m8-*.yaml|m8.4-*.yaml|m84-*.yaml|m9-*.yaml|m9.1-*.yaml|m9.2-*.yaml|m91-*.yaml|m92-*.yaml)
                echo "Removing obsolete workflow: $path"
                git rm -f --ignore-unmatch -- "$path"
                ;;
            esac
          done < <(git ls-files '.github/workflows/*')

          # If v2 is uploaded under a new filename, remove the old M10 workflow too.
          OLD_M10=".github/workflows/m10-final-release-build.yml"
          if [ "$CURRENT_WORKFLOW" != "$OLD_M10" ]; then
            git rm -f --ignore-unmatch -- "$OLD_M10"
          fi

          # Prevent CI outputs/build folders from being committed later.
          touch .gitignore
          if ! grep -q '^# WSK CI generated outputs$' .gitignore; then
            cat >> .gitignore <<'EOF'

          # WSK CI generated outputs
          .gradle/
          build/
          app/build/
          *.log
          .m9-stage
          build-diagnose.txt
          junit-failures.txt
          release-sha256.txt
          m9-readiness.txt
          unit-test-summary.txt
          release-permissions.txt
          release-badging.txt
          debug-badging.txt
          zipalign-check.txt
          apksigner-check.txt
          apk-size-top.txt
          aab-size-top.txt
          bundled-audio-size.txt
          release-dependencies.txt
          release-apk-path.txt
          release-aab-path.txt
          repo-cleanup-report.txt
          EOF
          fi

          {
            echo 'WAKTU SOLAT & KIBLAT REPOSITORY CLEANUP'
            echo '======================================='
            echo
            echo 'Known obsolete/generated tracked paths staged for deletion:'
            git diff --cached --name-status --diff-filter=D || true
            echo
            echo 'Current workflow preserved:'
            echo "$CURRENT_WORKFLOW"
          } > repo-cleanup-report.txt

          cat repo-cleanup-report.txt

      - name: Static source audit
        id: audit
        if: steps.cleanup.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee static-audit.log) 2>&1
          trap 'rc=$?; echo "STATIC_AUDIT_FAILED rc=$rc line=$LINENO command=$BASH_COMMAND"; exit $rc' ERR
          echo "STATIC_AUDIT" > .m9-stage

          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'warningsAsErrors = true' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'proguard-android-optimize.txt' app/build.gradle.kts
          grep -q '"proguard-rules.pro"' app/build.gradle.kts
          test -s app/proguard-rules.pro
          grep -q 'PrayerRefreshWorker' app/proguard-rules.pro
          grep -q 'AzanPlaybackService' app/proguard-rules.pro
          grep -q 'PrayerAlarmReceiver' app/proguard-rules.pro
          grep -q 'RescheduleReceiver' app/proguard-rules.pro
          grep -q 'ANDROID_KEYSTORE_PATH' app/build.gradle.kts
          grep -q 'releaseSigningConfig?.let' app/build.gradle.kts

          if gradle --no-daemon -q :app:tasks --all | grep -q '^testReleaseUnitTest '; then
            echo 'Optional release unit-test task is available.'
          else
            echo 'Release unit-test task is not exposed by this project. Debug unit tests remain the unit-test gate.'
          fi


          grep -q 'BuildConfig.VERSION_NAME' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'WaktuSolatMalaysia/${BuildConfig.VERSION_NAME}' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt

          grep -q 'copy(zohor = "07:00:00")' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun invalidTimeFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun duplicateDatesFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun badStatusFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun emptyDaysFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt

          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml

          if grep -Rni 'ACCESS_BACKGROUND_LOCATION' app/src/main app/build.gradle.kts; then
            echo 'ERROR: background location permission is not allowed.'
            exit 1
          fi

          if grep -RniE 'READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|RECEIVE_SMS|READ_PHONE_STATE|CALL_PHONE|RECORD_AUDIO|CAMERA|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: unrelated high-risk permission detected in source manifest.'
            exit 1
          fi

          if grep -Rni 'requestLocationUpdates' app/src/main/java; then
            echo 'ERROR: continuous location updates detected.'
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo 'ERROR: invalid Compose weight import detected.'
            exit 1
          fi

          if grep -RniE 'requestSingleUpdate\(|Locale\("ms"[[:space:]]*,[[:space:]]*"MY"\)' app/src/main/java; then
            echo 'ERROR: deprecated M6 APIs returned.'
            exit 1
          fi

          if grep -RniF 'context.mainExecutor' app/src/main/java; then
            echo 'ERROR: API 28 Context.mainExecutor returned; minSdk must remain 26.'
            exit 1
          fi

          grep -q 'ContextCompat.getMainExecutor(context)' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'import androidx.core.content.ContextCompat' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'minSdk = 26' app/build.gradle.kts

          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'Waktu Solat &amp; Kiblat' app/src/main/res/values/strings.xml
          grep -q 'TimeFormatMode.HOUR_12' app/src/main/java/app/nudroidlabs/waktusolat/data/TimeFormatPreferences.kt
          grep -q 'TimeFormatMode.HOUR_24' app/src/main/java/app/nudroidlabs/waktusolat/data/TimeFormatPreferences.kt
          grep -q 'ic_location_target' app/src/main/java/app/nudroidlabs/waktusolat/ui/HomeScreen.kt
          grep -q 'requestLocationDetection(autoApplyZone = true)' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt

          grep -q 'LocationManagerCompat.isLocationEnabled(locationManager)' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'Settings.ACTION_LOCATION_SOURCE_SETTINGS' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'showLocationServicesDialog' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'QiblaAlignmentGate' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'ToneGenerator.TONE_PROP_ACK' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml
          grep -q 'VIBRATE("Getar")' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt

          if grep -qE 'VibrationEffect|Vibrator|\.vibrate\(' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt; then
            echo 'ERROR: Qibla vibration implementation returned.'
            exit 1
          fi

          if grep -q 'Bunyi dan getaran' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt; then
            echo 'ERROR: stale Qibla vibration text returned.'
            exit 1
          fi

          WSM_BASE64

          base64 --decode /tmp/wsm-m1.b64 > /tmp/wsm-m1.zip
          rm -rf /tmp/wsm-m1
          mkdir -p /tmp/wsm-m1
          unzip -q /tmp/wsm-m1.zip -d /tmp/wsm-m1

          SOURCE="/tmp/wsm-m1/WaktuSolatMalaysia-M1"
          test -f "$SOURCE/settings.gradle.kts"
          test -f "$SOURCE/app/build.gradle.kts"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"

          # Keep this bootstrap workflow as the only workflow.
          rm -rf "$SOURCE/.github"

          cp -a "$SOURCE"/. ./

          grep -q 'app.nudroidlabs.waktusolat' app/build.gradle.kts

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found in project."
            exit 1
          fi

      - name: Commit imported M1 project
        if: steps.project.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "Bootstrap Waktu Solat Malaysia M1"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify project identity
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'app.nudroidlabs.waktusolat' app/build.gradle.kts
          grep -q 'Waktu Solat Malaysia' app/src/main/res/values/strings.xml

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found."
            exit 1
          fi

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate M4 source
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_VALIDATION" > .m4-stage

          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'lifecycle-runtime-ktx:2.11.0' app/build.gradle.kts
          grep -q 'core-ktx:1.19.0' app/build.gradle.kts
          grep -q 'work-runtime-ktx:2.11.2' app/build.gradle.kts
          grep -q 'warningsAsErrors = true' app/build.gradle.kts

          grep -q 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml

          test -f app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          test -f app/src/main/res/drawable/ic_launcher_monochrome.xml
          grep -q '<monochrome ' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q '<monochrome ' app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/RescheduleReceiver.kt
          grep -q 'SUPPORTED_ACTIONS' app/src/main/java/app/nudroidlabs/waktusolat/notification/RescheduleReceiver.kt
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmReceiver.kt
          grep -q 'SecurityException' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmReceiver.kt

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found."
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo "ERROR: invalid Compose weight import found."
            exit 1
          fi

          if grep -RniE 'Uri\.parse\(|\.edit\(\)' app/src/main/java; then
            echo "ERROR: lint-clean KTX migration is incomplete."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          offenders = []
          for path in Path("app/src/main/java").rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              if re.search(r"\.edit\s*\{", text):
                  if "import androidx.core.content.edit" not in text:
                      offenders.append(str(path))

          if offenders:
              print("ERROR: SharedPreferences KTX edit import missing:")
              for item in offenders:
                  print(f" - {item}")
              raise SystemExit(1)

          print("SharedPreferences KTX import audit: PASS")
          PY

          if grep -RInE '[[:blank:]]+$' README.md app \
              --include='*.kt' --include='*.kts' --include='*.xml' --include='*.md'; then
            echo "ERROR: trailing whitespace found."
            exit 1
          fi

          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(path)
          ET.parse("app/src/main/AndroidManifest.xml")
          print("XML parse: PASS")
          PY

      - name: Lightweight and battery audit
        shell: bash
        run: |
          set -euo pipefail
          echo "LIGHTWEIGHT_AUDIT" > .m4-stage

          if grep -q 'ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml; then
            echo "ERROR: background location permission must not be present."
            exit 1
          fi

          if grep -q 'android.permission.WAKE_LOCK' app/src/main/AndroidManifest.xml; then
            echo "ERROR: explicit wake lock permission is not allowed in this lightweight build."
            exit 1
          fi

          grep -q 'unregisterListener' \
            app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaSensor.kt

          grep -q '24,' \
            app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          grep -q 'TimeUnit.HOURS' \
            app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt

          if grep -Eqi \
            'firebase-analytics|play-services-ads|facebook.*sdk|appsflyer|adjust-android' \
            app/build.gradle.kts; then
            echo "ERROR: analytics, ads, or tracking SDK detected."
            exit 1
          fi

          echo "Battery and lightweight static audit: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mark Android SDK stage
        shell: bash
        run: echo "ANDROID_SDK_SETUP" > .m4-stage

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Prepare Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_INSTALL" > .m4-stage

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

          PLATFORM_DIR=""

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            PLATFORM_DIR="$ANDROID_HOME/platforms/android-37.0"
          elif [ -d "$ANDROID_HOME/platforms/android-37" ]; then
            PLATFORM_DIR="$ANDROID_HOME/platforms/android-37"
          else
            echo "Android API 37.0 platform is not present."
            echo "Available platforms:"
            ls -1 "$ANDROID_HOME/platforms" || true
            exit 1
          fi

          test -f "$PLATFORM_DIR/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Using Android platform: $PLATFORM_DIR"
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" | tail -n 20

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Unit tests and APK build
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_BUILD" > .m4-stage

          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            2>&1 | tee build-full.log

      - name: Strict Android Lint
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_LINT" > .m4-stage

          gradle --no-daemon --stacktrace :app:lintDebug \
            2>&1 | tee lint-full.log

          report="app/build/reports/lint-results-debug.txt"
          test -f "$report"

          if grep -En ':[0-9]+: (Error|Warning|Hint):' "$report"; then
            echo "ERROR: M4 requires a clean lint report with no Error, Warning, or Hint entries."
            exit 1
          fi

          echo "Android Lint: CLEAN"

      - name: Verify APK and record size
        shell: bash
        run: |
          set -euo pipefail
          echo "APK_VERIFY" > .m4-stage

          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          bytes=$(stat -c '%s' "$apk")
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1048576 }')

          {
            echo "Waktu Solat Malaysia 0.4.0 M4"
            echo "APK bytes: $bytes"
            echo "APK MiB: $mib"
            sha256sum "$apk"
          } | tee apk-metadata.txt

      - name: Commit M4 only after clean build
        shell: bash
        run: |
          set -euo pipefail
          echo "COMMIT_M4" > .m4-stage

          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A README.md app

          if git diff --cached --quiet; then
            echo "M4 source is already committed."
          else
            git commit -m "M4 clean stable release"
            git push origin HEAD:main
          fi

      - name: Upload M4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-0.4.0-M4-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-metadata.txt
            app/build/reports/lint-results-debug.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e

          stage="$(cat .m4-stage 2>/dev/null || echo UNKNOWN)"

          {
            echo "WAKTU SOLAT MALAYSIA M4 DIAGNOSE"
            echo "================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: $stage"
            echo
            echo "GIT STATUS"
            echo "----------"
            git status --short 2>/dev/null || true
            echo
            echo "PROJECT CONFIG"
            echo "--------------"
            grep -nE \
              'compileSdk|targetSdk|versionCode|versionName|lifecycle-runtime|core-ktx|work-runtime|warningsAsErrors' \
              app/build.gradle.kts 2>/dev/null || true
            echo
            echo "ANDROID SDK"
            echo "-----------"
            command -v sdkmanager || true
            sdkmanager --version 2>/dev/null || true
            ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            cat build-full.log lint-full.log 2>/dev/null | grep -nEi \
              '(^e: |error:|warning:|hint:|FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred|Caused by:|MissingPermission|UnsafeProtectedBroadcastReceiver|ObsoleteSdkInt|UnusedResources|MonochromeLauncherIcon|UseKtx|OldTargetApi|GradleDependency|Unresolved reference|Compilation error|Manifest merger failed)' \
              | tail -n 220 || true
            echo
            echo "LINT REPORT"
            echo "-----------"
            cat app/build/reports/lint-results-debug.txt 2>/dev/null || true
            echo
            echo "LAST 260 BUILD LINES"
            echo "--------------------"
            tail -n 260 build-full.log 2>/dev/null || true
            echo
            echo "LAST 260 LINT LINES"
            echo "-------------------"
            tail -n 260 lint-full.log 2>/dev/null || true
          } > build-diagnose.txt

          cat build-diagnose.txt

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M4-build-diagnose
          path: |
            build-diagnose.txt
            build-full.log
            lint-full.log
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

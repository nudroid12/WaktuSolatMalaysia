          base64 --decode /tmp/wsm-m84.b64 > /tmp/wsm-m84.zip

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path('/tmp/wsm-m84.zip')
          with zipfile.ZipFile(archive) as z:
              bad = [name for name in z.namelist() if name.startswith('/') or '..' in Path(name).parts]
              if bad:
                  raise SystemExit(f'Unsafe patch paths: {bad}')
              broken = z.testzip()
              if broken:
                  raise SystemExit(f'Corrupt patch member: {broken}')
              z.extractall('.')
          PY

          echo "Fetching public-domain-marked built-in azan audio..."
          mkdir -p app/src/main/res/raw

          curl --fail --location --retry 4 --retry-delay 2 \
            --connect-timeout 20 \
            --output app/src/main/res/raw/azan_builtin_subuh.ogg \
            "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_01_Fajr_Adhan.ogg"

          curl --fail --location --retry 4 --retry-delay 2 \
            --connect-timeout 20 \
            --output app/src/main/res/raw/azan_builtin_normal.ogg \
            "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_02_Dhuhr_Adhan.ogg"

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/res/raw/azan_builtin_subuh.ogg"),
              Path("app/src/main/res/raw/azan_builtin_normal.ogg"),
          ]

          for path in files:
              data = path.read_bytes()
              if len(data) < 500_000:
                  raise SystemExit(f"Audio file is unexpectedly small: {path} ({len(data)} bytes)")
              if data[:4] != b"OggS":
                  raise SystemExit(f"Audio file is not an Ogg stream: {path}")

          print("Built-in azan audio validation: PASS")
          PY

      - name: Static source audit
        id: audit
        if: steps.precheck.outcome == 'success' && steps.patch.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee static-audit.log) 2>&1
          echo "STATIC_AUDIT" > .m84-stage

          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'warningsAsErrors = true' app/build.gradle.kts

          grep -q 'BuildConfig.VERSION_NAME' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'WaktuSolatMalaysia/${BuildConfig.VERSION_NAME}' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt

          grep -q 'copy(zohor = "07:00:00")' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun invalidTimeFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun duplicateDatesFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun badStatusFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun emptyDaysFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt

          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml

          if grep -Rni 'ACCESS_BACKGROUND_LOCATION' app/src/main app/build.gradle.kts; then
            echo 'ERROR: background location permission is not allowed.'
            exit 1
          fi

          if grep -Rni 'requestLocationUpdates' app/src/main/java; then
            echo 'ERROR: continuous location updates detected.'
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo 'ERROR: invalid Compose weight import detected.'
            exit 1
          fi

          if grep -RniE 'requestSingleUpdate\(|Locale\("ms"[[:space:]]*,[[:space:]]*"MY"\)' app/src/main/java; then
            echo 'ERROR: deprecated M6 APIs returned.'
            exit 1
          fi

          if grep -RniF 'context.mainExecutor' app/src/main/java; then
            echo 'ERROR: API 28 Context.mainExecutor returned; minSdk must remain 26.'
            exit 1
          fi

          grep -q 'ContextCompat.getMainExecutor(context)' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'import androidx.core.content.ContextCompat' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'minSdk = 26' app/build.gradle.kts

          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' app/build.gradle.kts
          grep -q 'Waktu Solat &amp; Kiblat' app/src/main/res/values/strings.xml
          grep -q 'TimeFormatMode.HOUR_12' app/src/main/java/app/nudroidlabs/waktusolat/data/TimeFormatPreferences.kt
          grep -q 'TimeFormatMode.HOUR_24' app/src/main/java/app/nudroidlabs/waktusolat/data/TimeFormatPreferences.kt
          grep -q 'ic_location_target' app/src/main/java/app/nudroidlabs/waktusolat/ui/HomeScreen.kt
          grep -q 'requestLocationDetection(autoApplyZone = true)' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt

          grep -q 'LocationManagerCompat.isLocationEnabled(locationManager)' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          grep -q 'Settings.ACTION_LOCATION_SOURCE_SETTINGS' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'showLocationServicesDialog' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'QiblaAlignmentGate' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'ToneGenerator.TONE_PROP_ACK' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml
          grep -q 'VibrationEffect.createOneShot' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'context.getSystemService(Vibrator::class.java)' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt
          grep -q 'LazyColumn' app/src/main/java/app/nudroidlabs/waktusolat/ui/HomeScreen.kt

          test -s app/src/main/res/raw/azan_builtin_subuh.ogg
          test -s app/src/main/res/raw/azan_builtin_normal.ogg
          grep -q 'enum class AzanAudioSource' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPreferences.kt
          grep -q 'R.raw.azan_builtin_subuh' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          grep -q 'R.raw.azan_builtin_normal' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          grep -q 'AudioAttributes.USAGE_ALARM' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          grep -q 'AzanPreferences.hasPlayableAudio(context)' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'AzanAudioSource.entries' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          test -f app/src/main/assets/BUILT_IN_AZAN_AUDIO.txt

          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path("app/src/main/res/raw/azan_builtin_subuh.ogg"),
              Path("app/src/main/res/raw/azan_builtin_normal.ogg"),
          ):
              data = path.read_bytes()
              if data[:4] != b"OggS":
                  raise SystemExit(f"Invalid Ogg audio: {path}")
          print("Built-in azan resource audit: PASS")
          PY

          if grep -q 'performHapticFeedback' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt; then
            echo 'ERROR: Compose-only qibla haptic implementation returned.'
            exit 1
          fi

          if grep -q 'LocalHapticFeedback' app/src/main/java/app/nudroidlabs/waktusolat/ui/QiblaScreen.kt; then
            echo 'ERROR: obsolete qibla haptic import returned.'
            exit 1
          fi
          test -f app/src/test/java/app/nudroidlabs/waktusolat/qibla/QiblaAlignmentGateTest.kt

          grep -q 'com.google.android.gms:play-services-location:21.4.0' app/build.gradle.kts
          grep -q 'ActivityResultContracts.StartIntentSenderForResult' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'ResolvableApiException' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'GoogleApiAvailability' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'SettingsSectionHeader' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'rememberSaveable' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q '"Dhuha" to day.dhuha' app/src/main/java/app/nudroidlabs/waktusolat/ui/Components.kt

          if grep -Rni '"Duha"' app/src/main/java; then
            echo 'ERROR: old Duha label remains.'
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo 'ERROR: invalid Compose weight import returned.'
            exit 1
          fi

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo 'ERROR: KCS identifier found.'
            exit 1
          fi

          if grep -niE 'firebase-analytics|play-services-ads|appsflyer|adjust-android|facebook-android-sdk' app/build.gradle.kts; then
            echo 'ERROR: analytics or advertising dependency detected.'
            exit 1
          fi

          grep -q '24,' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          grep -q 'TimeUnit.HOURS' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          grep -q 'unregisterListener' app/src/main/java/app/nudroidlabs/waktusolat/qibla/QiblaSensor.kt

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for path in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(path)
          ET.parse('app/src/main/AndroidManifest.xml')

          missing = []
          for path in Path('app/src/main/java').rglob('*.kt'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'\.edit\s*\{', text) and 'import androidx.core.content.edit' not in text:
                  missing.append(str(path))
          if missing:
              raise SystemExit('Missing androidx.core.content.edit import: ' + ', '.join(missing))

          test = Path('app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt').read_text(encoding='utf-8')
          if 'copy(zohor = "08:00:00")' in test:
              raise SystemExit('Old M7 false-positive unordered test data is still present')
          PY

          echo "Running whitespace audit..."
          if ! git diff --check; then
            echo "ERROR: git diff --check found whitespace or blank-line-at-EOF problems."
            exit 1
          fi

      - name: Set up JDK 17
        id: java
        if: steps.audit.outcome == 'success'
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        id: android
        if: steps.java.outcome == 'success'
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Prepare Android API 37 platform
        id: sdk
        if: steps.android.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "ANDROID_SDK" > .m84-stage

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

          PLATFORM_DIR=""
          for candidate in android-37.0 android-37; do
            if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
              PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
              break
            fi
          done

          if [ -z "$PLATFORM_DIR" ]; then
            PACKAGE="$({ sdkmanager --list || true; } | awk -F'|' '
              /platforms;android-37([.]0)?[[:space:]]*[|]/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                print $1
                exit
              }
            ')"
            if [ -z "$PACKAGE" ]; then
              echo 'ERROR: No installable Android API 37 platform found.'
              ls -1 "$ANDROID_HOME/platforms" || true
              exit 1
            fi
            sdkmanager "$PACKAGE"

            for candidate in android-37.0 android-37; do
              if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
                PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
                break
              fi
            done
          fi

          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Using Android platform: $PLATFORM_DIR"

      - name: Set up Gradle 9.4.1
        id: gradle
        if: steps.sdk.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        id: unit
        if: steps.gradle.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "UNIT_TESTS" > .m84-stage
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Compile debug and release variants
        id: build
        if: steps.unit.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "COMPILE_VARIANTS" > .m84-stage
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      - name: Lint debug and release variants
        id: lint
        if: steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "LINT_VARIANTS" > .m84-stage
          gradle --no-daemon --stacktrace :app:lintDebug :app:lintRelease 2>&1 | tee lint.log

      - name: Release hardening audit
        id: hardening
        if: steps.lint.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "HARDENING_AUDIT" > .m84-stage

          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/reports/lint-results-debug.html
          test -f app/build/reports/lint-results-release.html

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > debug-badging.txt
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > release-badging.txt

          grep -q "package: name='app.nudroidlabs.waktusolat'" debug-badging.txt
          grep -q "versionName='0.8.4'" debug-badging.txt
          grep -q "targetSdkVersion:'37'" debug-badging.txt
          grep -q "package: name='app.nudroidlabs.waktusolat'" release-badging.txt
          grep -q "versionName='0.8.4'" release-badging.txt

          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk >> apk-sha256.txt

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          tests = failures = errors = skipped = 0
          for file in files:
              root = ET.parse(file).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          if not files or failures or errors:
              raise SystemExit(f'Unit-test report not clean: files={len(files)} failures={failures} errors={errors}')
          Path('unit-test-summary.txt').write_text(
              f'tests={tests} failures={failures} errors={errors} skipped={skipped}\n',
              encoding='utf-8'
          )
          PY

          DEBUG_BYTES=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          RELEASE_BYTES=$(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)
          {
            echo 'WAKTU SOLAT & KIBLAT M8.3 RELEASE READINESS'
            echo '========================================'
            echo
            echo 'Version: 0.8.4'
            echo 'Application ID: app.nudroidlabs.waktusolat'
            echo 'Target SDK: 37'
            echo 'Unit tests: PASS'
            echo 'Debug compile: PASS'
            echo 'Release compile: PASS'
            echo 'Debug lint: PASS'
            echo 'Release lint: PASS'
            echo 'Static battery/permission audit: PASS'
            echo "Debug APK bytes: $DEBUG_BYTES"
            echo "Unsigned release APK bytes: $RELEASE_BYTES"
            echo 'APK size is informational only and is not a release gate.'
          } > m84-readiness.txt

          cat unit-test-summary.txt
          cat m84-readiness.txt

      - name: Verify M8.3 outputs
        id: verify
        if: steps.hardening.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "VERIFY_OUTPUT" > .m84-stage
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s m84-readiness.txt
          test -s apk-sha256.txt

      - name: Commit M8.3 after full success
        id: commit
        if: steps.verify.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "COMMIT" > .m84-stage
          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md app
          if git diff --cached --quiet; then
            echo 'M8.3 source is already committed.'
          else
            git commit -m "Add built-in Subuh and normal azan in M8.4"
            git push origin HEAD:main
          fi

      - name: Upload M8.3 artifacts
        id: success_upload
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Waktu-Solat-Kiblat-0.8.4-M8.4
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
            m84-readiness.txt
            unit-test-summary.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 14

      - name: Create detailed failure diagnostic
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        shell: bash
        run: |
          set +e
          STAGE="$(cat .m84-stage 2>/dev/null || echo UNKNOWN)"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          out = []
          files = sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              out.append('No JUnit XML files were produced.')
          for file in files:
              try:
                  root = ET.parse(file).getroot()
              except Exception as exc:
                  out.append(f'Could not parse {file}: {exc}')
                  continue
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  problem = failure if failure is not None else error
                  if problem is not None:
                      out.append(f"FAILED: {case.attrib.get('classname')} > {case.attrib.get('name')}")
                      message = problem.attrib.get('message')
                      if message:
                          out.append(f'MESSAGE: {message}')
                      text = (problem.text or '').strip()
                      if text:
                          out.extend(text.splitlines()[:80])
                      out.append('')
          Path('junit-failures.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          {
            echo 'WAKTU SOLAT & KIBLAT M8.3 BUILD DIAGNOSE'
            echo '======================================'
            echo
            echo 'RESULT: FAILED'
            echo "LAST STAGE: $STAGE"
            echo
            echo 'STEP OUTCOMES'
            echo '-------------'
            echo "precheck=${{ steps.precheck.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "java=${{ steps.java.outcome }}"
            echo "android=${{ steps.android.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "unit=${{ steps.unit.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "hardening=${{ steps.hardening.outcome }}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "commit=${{ steps.commit.outcome }}"
            echo "success_upload=${{ steps.success_upload.outcome }}"
            echo
            echo 'BUILD CONFIG'
            echo '------------'
            grep -nE 'compileSdk|targetSdk|versionCode|versionName|warningsAsErrors' app/build.gradle.kts 2>/dev/null || true
            echo
            echo 'STATIC AUDIT LOG'
            echo '----------------'
            cat static-audit.log 2>/dev/null || true
            echo
            echo 'JUNIT FAILURES'
            echo '--------------'
            cat junit-failures.txt 2>/dev/null || true
            echo
            echo 'UNIT TEST ERROR CANDIDATES'
            echo '--------------------------'
            grep -nEi 'FAILED|AssertionError|expected|actual|Exception|FAILURE:|What went wrong|Execution failed' unit-test.log 2>/dev/null | tail -n 200 || true
            echo
            echo 'COMPILE ERROR CANDIDATES'
            echo '------------------------'
            grep -nEi '(^e: |error:|FAILURE:|What went wrong|Execution failed|Unresolved reference|Compilation error|Manifest merger failed|Could not resolve|Could not find)' build.log 2>/dev/null | tail -n 220 || true
            echo
            echo 'LINT ERROR CANDIDATES'
            echo '---------------------'
            grep -nEi 'error:|warning:|Lint found|ObsoleteSdkInt|MissingPermission|NewApi|ExpiredTargetSdkVersion' lint.log 2>/dev/null | tail -n 260 || true
            echo
            echo 'LAST UNIT TEST LOG'
            echo '------------------'
            tail -n 180 unit-test.log 2>/dev/null || true
            echo
            echo 'LAST BUILD LOG'
            echo '--------------'
            tail -n 180 build.log 2>/dev/null || true
            echo
            echo 'LAST LINT LOG'
            echo '-------------'
            tail -n 220 lint.log 2>/dev/null || true
          } > build-diagnose.txt

          cat build-diagnose.txt

      - name: Upload M8.3 failure diagnostic
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Kiblat-M8.4-build-diagnose
          path: |
            build-diagnose.txt
            static-audit.log
            junit-failures.txt
            unit-test.log
            build.log
            lint.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.txt
            app/build/reports/lint-results-release.html
            debug-badging.txt
            release-badging.txt
            m84-readiness.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if any M8.3 gate failed
        if: always() && (steps.precheck.outcome == 'failure' || steps.patch.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.java.outcome == 'failure' || steps.android.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.gradle.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.success_upload.outcome == 'failure')
        shell: bash
        run: exit 1

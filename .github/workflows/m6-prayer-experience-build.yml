      - name: Validate M6 source
        shell: bash
        run: |
          set -euo pipefail
          echo "VALIDATE_SOURCE" > .m6-stage

          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "0.6.0"' app/build.gradle.kts
          grep -q 'warningsAsErrors = true' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime-ktx:2.11.2' app/build.gradle.kts

          grep -q 'Current milestone: M6' README.md
          grep -q 'WaktuSolatMalaysia/0.6.0' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt

          grep -q 'enum class PrayerAlertStyle' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'listOf(0, 5, 10, 15, 20, 30)' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'KEY_LEAD_PREFIX' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'CHANNEL_ID_VIBRATE' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'CHANNEL_ID_SILENT' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          grep -q 'scheduleNeeded' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt

          grep -q 'enabledForPrayer' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPreferences.kt
          grep -q 'fun preview(context: Context)' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          grep -q 'fun stop(context: Context)' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt
          grep -q 'AUDIOFOCUS_LOSS_TRANSIENT' app/src/main/java/app/nudroidlabs/waktusolat/audio/AzanPlaybackService.kt

          grep -q 'Intent.ACTION_MY_PACKAGE_REPLACED' app/src/main/java/app/nudroidlabs/waktusolat/notification/RescheduleReceiver.kt
          grep -q 'android.intent.action.MY_PACKAGE_REPLACED' app/src/main/AndroidManifest.xml

          grep -q 'leadMinutesByPrayer' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'onAlertStyleChange' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'onTestAzan' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'Settings.ACTION_APP_NOTIFICATION_SETTINGS' app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found."
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo "ERROR: invalid Compose weight import found."
            exit 1
          fi

          if grep -RniE 'ACCESS_BACKGROUND_LOCATION|android\.permission\.WAKE_LOCK' app/src/main; then
            echo "ERROR: continuous-background battery permission found."
            exit 1
          fi

          grep -q '24,' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          grep -q 'TimeUnit.HOURS' app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt

          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("app")
          errors = []

          for path in root.rglob("*.xml"):
              try:
                  ET.parse(path)
              except Exception as exc:
                  errors.append(f"XML parse failed: {path}: {exc}")

          text_suffixes = {".kt", ".kts", ".xml", ".md", ".properties", ".txt", ".json"}
          for base in [Path("README.md"), root]:
              files = [base] if base.is_file() else [p for p in base.rglob("*") if p.is_file()]
              for path in files:
                  if path.suffix.lower() not in text_suffixes and path.name != "README.md":
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if line.endswith(" ") or line.endswith("\t"):
                          errors.append(f"Trailing whitespace: {path}:{number}")
                          break

          for path in root.rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              if re.search(r"\.edit\s*\{", text) and "import androidx.core.content.edit" not in text:
                  errors.append(f"Missing SharedPreferences KTX import: {path}")

          def check_balance(path: Path):
              source = path.read_text(encoding="utf-8")
              stack = []
              pairs = {")": "(", "]": "[", "}": "{"}
              opens = set(pairs.values())
              state = "code"
              i = 0
              line = 1
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ""
                  if ch == "\n":
                      line += 1
                  if state == "code":
                      if ch == "/" and nxt == "/":
                          state = "line"
                          i += 2
                          continue
                      if ch == "/" and nxt == "*":
                          state = "block"
                          i += 2
                          continue
                      if source[i:i + 3] == '"""':
                          state = "triple"
                          i += 3
                          continue
                      if ch == '"':
                          state = "string"
                          i += 1
                          continue
                      if ch == "'":
                          state = "char"
                          i += 1
                          continue
                      if ch in opens:
                          stack.append((ch, line))
                      elif ch in pairs:
                          if not stack or stack[-1][0] != pairs[ch]:
                              errors.append(f"Delimiter mismatch: {path}:{line}")
                              return
                          stack.pop()
                  elif state == "line":
                      if ch == "\n":
                          state = "code"
                  elif state == "block":
                      if ch == "*" and nxt == "/":
                          state = "code"
                          i += 2
                          continue
                  elif state == "string":
                      if ch == "\\":
                          i += 2
                          continue
                      if ch == '"':
                          state = "code"
                  elif state == "char":
                      if ch == "\\":
                          i += 2
                          continue
                      if ch == "'":
                          state = "code"
                  elif state == "triple":
                      if source[i:i + 3] == '"""':
                          state = "code"
                          i += 3
                          continue
                  i += 1
              if stack:
                  errors.append(f"Unclosed delimiter: {path}:{stack[-1][1]}")
              if state in {"block", "string", "char", "triple"}:
                  errors.append(f"Unclosed lexical state {state}: {path}")

          for path in list(root.rglob("*.kt")) + list(root.rglob("*.kts")):
              check_balance(path)

          settings = Path("app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt").read_text(encoding="utf-8")
          app = Path("app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt").read_text(encoding="utf-8")
          signature = settings.split("fun SettingsScreen(", 1)[1].split(") {", 1)[0]
          params = []
          for line in signature.splitlines():
              match = re.match(r"\s*([A-Za-z_][A-Za-z0-9_]*)\s*:", line)
              if match:
                  params.append(match.group(1))

          start = app.index("AppTab.SETTINGS -> SettingsScreen(")
          chunk = app[start:]
          args = []
          for line in chunk.splitlines()[1:]:
              if line.startswith("            )"):
                  break
              match = re.match(r"^\s{16}([A-Za-z_][A-Za-z0-9_]*)\s*=", line)
              if match:
                  args.append(match.group(1))

          missing = [item for item in params if item not in args]
          extra = [item for item in args if item not in params]
          if missing or extra:
              errors.append(f"SettingsScreen call mismatch. Missing={missing}, extra={extra}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("M6 static source audit: PASS")
          PYCODE

          git diff --check

      - name: Mark Java setup stage
        run: echo "SETUP_JAVA" > .m6-stage

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mark Android setup stage
        run: echo "SETUP_ANDROID" > .m6-stage

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Prepare Android API 37 platform
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK" > .m6-stage

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

          PLATFORM_DIR=""
          for candidate in android-37.0 android-37; do
            if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
              PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
              break
            fi
          done

          if [ -z "$PLATFORM_DIR" ]; then
            PACKAGE="$({ sdkmanager --list || true; } | awk -F'|' '
              /platforms;android-37([.]0)?[[:space:]]*[|]/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                print $1
                exit
              }
            ')"
            if [ -z "$PACKAGE" ]; then
              echo "ERROR: No installable Android API 37 platform found."
              echo "Available platform directories:"
              ls -1 "$ANDROID_HOME/platforms" || true
              exit 1
            fi
            echo "Installing discovered platform package: $PACKAGE"
            sdkmanager "$PACKAGE"

            for candidate in android-37.0 android-37; do
              if [ -f "$ANDROID_HOME/platforms/$candidate/android.jar" ]; then
                PLATFORM_DIR="$ANDROID_HOME/platforms/$candidate"
                break
              fi
            done
          fi

          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Using Android platform: $PLATFORM_DIR"

      - name: Mark Gradle setup stage
        run: echo "SETUP_GRADLE" > .m6-stage

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build M6, unit test and lint
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_BUILD_TEST_LINT" > .m6-stage

          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            2>&1 | tee build-full.log

      - name: Verify APK and lint report
        shell: bash
        run: |
          set -euo pipefail
          echo "VERIFY_OUTPUT" > .m6-stage

          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/reports/lint-results-debug.html
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Commit M6 after full success
        shell: bash
        run: |
          set -euo pipefail
          echo "COMMIT" > .m6-stage

          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md app

          if git diff --cached --quiet; then
            echo "M6 source is already committed."
          else
            git commit -m "Add M6 prayer experience"
            git push origin HEAD:main
          fi

      - name: Upload M6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-0.6.0-M6-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

      - name: Create failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          STAGE="$(cat .m6-stage 2>/dev/null || echo UNKNOWN)"
          {
            echo "WAKTU SOLAT MALAYSIA M6 BUILD DIAGNOSE"
            echo "======================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: $STAGE"
            echo
            echo "GIT STATUS"
            echo "----------"
            git status --short || true
            echo
            echo "BUILD CONFIG"
            echo "------------"
            grep -nE 'compileSdk|targetSdk|versionCode|versionName|warningsAsErrors' app/build.gradle.kts 2>/dev/null || true
            echo
            echo "ANDROID SDK"
            echo "-----------"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            ls -1 "${ANDROID_HOME:-/missing}/platforms" 2>/dev/null || true
            ls -1 "${ANDROID_HOME:-/missing}/build-tools" 2>/dev/null || true
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            if [ -f build-full.log ]; then
              grep -nEi \
                '(^e: |error:|FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred|Caused by:|Unresolved reference|Compilation error|Manifest merger failed|Lint found|Fatal error|requires.*compileSdk|minCompileSdk)' \
                build-full.log | tail -n 240 || true
            else
              echo "build-full.log was not created. Failure occurred before Gradle build."
            fi
            echo
            echo "LAST BUILD LOG LINES"
            echo "--------------------"
            tail -n 360 build-full.log 2>/dev/null || true
            echo
            echo "LINT TEXT REPORT"
            echo "----------------"
            cat app/build/reports/lint-results-debug.txt 2>/dev/null || true
          } > build-diagnose.txt

          cat build-diagnose.txt

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M6-build-diagnose
          path: |
            build-diagnose.txt
            build-full.log
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

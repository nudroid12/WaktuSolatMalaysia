name: M10.1 Self Updater v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m101-self-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck baseline
        id: precheck
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "PRECHECK" > .m9-stage

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/PrayerModels.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/PrayerTimeEngine.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/JakimZones.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt

          grep -q 'applicationId = "app.nudroidlabs.waktusolat"' app/build.gradle.kts
          grep -Eq 'versionCode = (17|18)' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

      - name: Apply targeted M10.1 v3 updater patch
        id: patch
        if: steps.precheck.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee patch.log) 2>&1
          trap 'rc=$?; echo "APPLY_PATCH_FAILED rc=$rc line=$LINENO command=$BASH_COMMAND"; exit $rc' ERR
          echo "APPLY_PATCH" > .m9-stage

          if grep -q 'object AppUpdateManager'             app/src/main/java/app/nudroidlabs/waktusolat/update/AppUpdateManager.kt 2>/dev/null; then
            if grep -q 'PackageManager.GET_SIGNATURES'               app/src/main/java/app/nudroidlabs/waktusolat/update/AppUpdateManager.kt 2>/dev/null; then
              echo 'Detected source state: M10.1 v2-compatible updater already present.'
            else
              echo 'Detected source state: earlier M10.1 updater present.'
            fi
          else
            echo 'Detected source state: M10 baseline without updater.'
          fi

          cat > /tmp/wsk-m101v3.b64 <<'WSK_M101V3_BASE64'

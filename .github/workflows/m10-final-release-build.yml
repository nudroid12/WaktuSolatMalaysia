name: M10 Final Release 1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m10-final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck baseline
        id: precheck
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "PRECHECK" > .m9-stage

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/PrayerModels.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/PrayerTimeEngine.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/JakimZones.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt

          grep -q 'applicationId = "app.nudroidlabs.waktusolat"' app/build.gradle.kts
          grep -Eq 'versionCode = (17|18)' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

      - name: Apply complete M10 final patch
        id: patch
        if: steps.precheck.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "APPLY_PATCH" > .m9-stage


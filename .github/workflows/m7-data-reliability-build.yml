          grep -q 'isUsableForToday' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt
          grep -q 'Data cache sudah tamat tempoh' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt

          grep -q 'LocationManagerCompat.getCurrentLocation' app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          if grep -RniF 'requestSingleUpdate' app/src/main/java; then

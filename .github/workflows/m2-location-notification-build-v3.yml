      - name: Validate corrected M2 source
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime-ktx:2.11.2' app/build.gradle.kts

          grep -q 'ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_COARSE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml

          test -f app/src/main/java/app/nudroidlabs/waktusolat/location/JakimZoneResolver.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/location/LocationZoneDetector.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmScheduler.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerAlarmReceiver.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/PrayerRefreshWorker.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/notification/RescheduleReceiver.kt
          test -f app/src/test/java/app/nudroidlabs/waktusolat/location/JakimZoneResolverTest.kt

          if grep -RniE 'app\.kcs|com\.kcs|package[[:space:]]+.*kcs' app; then
            echo "ERROR: KCS identifier found."
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo "ERROR: Invalid Compose weight import found."
            exit 1
          fi

          git diff --check

      - name: Diagnose validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M2 DIAGNOSE"
            echo "================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: VALIDATION"
            echo
            echo "PROJECT CONFIG"
            echo "--------------"
            grep -nE 'compileSdk|targetSdk|versionCode|versionName|work-runtime' app/build.gradle.kts || true
            echo
            echo "BAD COMPOSE IMPORT CHECK"
            echo "------------------------"
            grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java || true
            echo
            echo "GIT DIFF CHECK"
            echo "--------------"
            git diff --check || true
            echo
            echo "GIT STATUS"
            echo "----------"
            git status --short || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload validation diagnostic
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M2-build-diagnose
          path: build-diagnose.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stop on validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build M2 with tests
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --stacktrace             :app:testDebugUnitTest             :app:assembleDebug             2>&1 | tee build-full.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Create build diagnostic
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M2 BUILD DIAGNOSE"
            echo "======================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: GRADLE BUILD"
            echo "BUILD EXIT CODE: ${{ steps.build.outputs.exit_code }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            grep -nEi               '(^e: |error:|FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred|Caused by:|requires.*compileSdk|minCompileSdk|Unresolved reference|Compilation error|Manifest merger failed|Duplicate class)'               build-full.log | tail -n 180 || true
            echo
            echo "LAST 260 LOG LINES"
            echo "------------------"
            tail -n 260 build-full.log || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload build diagnostic
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M2-build-diagnose
          path: |
            build-diagnose.txt
            build-full.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify built APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Commit M2 only after successful build
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NudroidLabs Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md app
          if git diff --cached --quiet; then
            echo "M2 source is already committed."
          else
            git commit -m "Add M2 location and prayer notifications"
            git push origin HEAD:main
          fi

      - name: Upload M2 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

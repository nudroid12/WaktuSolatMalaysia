name: M2 Location Notifications Build v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m2-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Precheck current project
        id: precheck
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/nudroidlabs/waktusolat/data/JakimZones.kt
          test -f app/src/main/java/app/nudroidlabs/waktusolat/ui/WaktuSolatApp.kt
          grep -q 'app.nudroidlabs.waktusolat' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Diagnose precheck failure
        if: steps.precheck.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "WAKTU SOLAT MALAYSIA M2 DIAGNOSE"
            echo "================================"
            echo
            echo "RESULT: FAILED"
            echo "STAGE: PRECHECK"
            echo
            echo "ROOT FILES"
            echo "----------"
            find . -maxdepth 2 -type f | sort | head -n 200
            echo
            echo "APP BUILD FILE"
            echo "--------------"
            cat app/build.gradle.kts 2>/dev/null || true
          } > build-diagnose.txt
          cat build-diagnose.txt

      - name: Upload precheck diagnostic
        if: steps.precheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Waktu-Solat-Malaysia-M2-build-diagnose
          path: build-diagnose.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stop on precheck failure
        if: steps.precheck.outcome == 'failure'
        run: exit 1

      - name: Apply corrected M2 patch

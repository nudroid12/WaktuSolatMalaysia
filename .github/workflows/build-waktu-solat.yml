name: Build Waktu Solat APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Apply Waktu Solat ZIP Patch]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew*'

permissions:
  contents: write

concurrency:
  group: waktu-solat-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[zip-applied]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          manager="$(command -v sdkmanager || true)"
          if [[ -z "$manager" ]]; then
            for candidate in "$sdk"/cmdline-tools/{latest,*}/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                manager="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$manager" ]]; then
            echo "::error::Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          packages="$("$manager" --sdk_root="$sdk" --list)"
          platform="$(awk -F'|' '$1 ~ /^[[:space:]]*platforms;android-37([.]0)?[[:space:]]*$/ {
            gsub(/[[:space:]]/, "", $1); print $1; exit
          }' <<< "$packages")"
          if [[ -z "$platform" ]]; then
            echo "::error::Android SDK 37 is unavailable."
            exit 1
          fi
          "$manager" --sdk_root="$sdk" --install "$platform" 'build-tools;36.0.0'

      - name: Build signed APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD."
            exit 1
          fi

          export ANDROID_KEYSTORE_PATH
          ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/waktu-solat-keystore.XXXXXX")"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset KEYSTORE_B64

          if ! entries="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD)"; then
            echo "::error::Cannot read the signing keystore. Check the file and password."
            exit 1
          fi
          mapfile -t aliases < <(awk '
            /^Alias name: / { alias = substr($0, length("Alias name: ") + 1) }
            /^Entry type: PrivateKeyEntry$/ { print alias }
          ' <<< "$entries")
          if (( ${#aliases[@]} != 1 )); then
            echo "::error::The keystore must contain exactly one signing key."
            exit 1
          fi
          export ANDROID_KEY_ALIAS="${aliases[0]}"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"

          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WaktuSolat-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK and update.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          current="$(jq -er '.versionCode | select(type == "number" and . >= 0 and . == floor)' update.json)"
          if [[ ! "$code" =~ ^[1-9][0-9]*$ || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric versionCode and an x.y.z versionName."
            exit 1
          fi
          if (( code <= current )); then
            echo "Version $version is already published or superseded."
            exit 0
          fi

          git fetch origin main
          commit="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$commit" ]]; then
            echo "::error::main changed during the build. Run the workflow again."
            exit 1
          fi

          tag="v$version"
          asset="WaktuSolat-$version.apk"
          apk="$RUNNER_TEMP/$asset"
          title="Waktu Solat & Kiblat $version"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern "$asset" --output "$RUNNER_TEMP/published.apk"
            if ! cmp -s "$apk" "$RUNNER_TEMP/published.apk"; then
              echo "::error::Release $tag already contains a different APK. Bump versionName and versionCode."
              exit 1
            fi
          else
            gh release create "$tag" "$apk" --target "$commit" --title "$title" --notes "$title"
          fi
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false

          hash="$(sha256sum "$apk" | cut -d' ' -f1)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          jq -n --argjson versionCode "$code" --arg versionName "$version" \
            --arg apkUrl "$url" --arg sha256 "$hash" --arg releaseNotes "$title" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, releaseNotes: $releaseNotes}' \
            > update.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Publish app update $version"
          git push origin HEAD:main

name: Build Waktu Solat APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
  workflow_run:
    workflows: [Apply Waktu Solat ZIP Patch]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: waktu-solat-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          manager="$(command -v sdkmanager || true)"
          manager="${manager:-$sdk/cmdline-tools/latest/bin/sdkmanager}"
          packages="$("$manager" --sdk_root="$sdk" --list)"
          platform="$(awk -F'|' '
            $1 ~ /^[[:space:]]*platforms;android-37([.]0)?[[:space:]]*$/ {
              gsub(/[[:space:]]/, "", $1)
              print $1
              exit
            }' <<< "$packages")"
          if [[ -z "$platform" ]]; then
            echo "::error::Android SDK 37 is required by app/build.gradle.kts and is unavailable."
            exit 1
          fi
          "$manager" --sdk_root="$sdk" --install "$platform" 'build-tools;36.0.0'
      - name: Test and build APKs
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_count=0
          for value in "$KEYSTORE_B64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then (( signing_count += 1 )); fi
          done
          tasks=(:app:testDebugUnitTest :app:assembleDebug)
          if (( signing_count == 4 )); then
            umask 077
            export ANDROID_KEYSTORE_PATH
            ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/waktu-solat-keystore.XXXXXX")"
            trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            tasks+=(:app:assembleRelease :app:bundleRelease)
          elif (( signing_count != 0 )); then
            echo "::error::Configure all four RELEASE_* signing secrets or leave all four unset for a debug build."
            exit 1
          fi
          unset KEYSTORE_B64 value
          gradle "${tasks[@]}" --stacktrace

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WaktuSolat-debug.apk
          if (( signing_count == 4 )); then
            apk=dist/WaktuSolat-release.apk
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            cp app/build/outputs/bundle/release/app-release.aab dist/WaktuSolat-release.aab
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
            "$sdk/build-tools/36.0.0/apksigner" verify "$apk"
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: WaktuSolat-Android
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WaktuSolat-Unit-Tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

              Path("app/src/main/res/raw/azan_builtin_normal.ogg"),
          ]

          for path in files:
              data = path.read_bytes()
              if len(data) < 500_000:
                  raise SystemExit(f"Audio file is unexpectedly small: {path} ({len(data)} bytes)")
              if data[:4] != b"OggS":
                  raise SystemExit(f"Audio file is not an Ogg stream: {path}")

          print("Built-in azan audio validation: PASS")
          PY

      - name: Static source audit
        id: audit
        if: steps.precheck.outcome == 'success' && steps.patch.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee static-audit.log) 2>&1
          echo "STATIC_AUDIT" > .m84-stage

          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'warningsAsErrors = true' app/build.gradle.kts

          grep -q 'BuildConfig.VERSION_NAME' app/src/main/java/app/nudroidlabs/waktusolat/ui/SettingsScreen.kt
          grep -q 'WaktuSolatMalaysia/${BuildConfig.VERSION_NAME}' app/src/main/java/app/nudroidlabs/waktusolat/data/JakimPrayerRepository.kt

          grep -q 'copy(zohor = "07:00:00")' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun invalidTimeFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun duplicateDatesFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun badStatusFails()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt
          grep -q 'fun emptyDaysFail()' app/src/test/java/app/nudroidlabs/waktusolat/data/PrayerDataValidatorTest.kt

          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml

          if grep -Rni 'ACCESS_BACKGROUND_LOCATION' app/src/main app/build.gradle.kts; then
            echo 'ERROR: background location permission is not allowed.'
            exit 1
          fi

          if grep -Rni 'requestLocationUpdates' app/src/main/java; then
            echo 'ERROR: continuous location updates detected.'
            exit 1
          fi

          if grep -RniF 'import androidx.compose.foundation.layout.weight' app/src/main/java; then
            echo 'ERROR: invalid Compose weight import detected.'
            exit 1
          fi

          if grep -RniE 'requestSingleUpdate\(|Locale\("ms"[[:space:]]*,[[:space:]]*"MY"\)' app/src/main/java; then
            echo 'ERROR: deprecated M6 APIs returned.'
            exit 1
          fi

          if grep -RniF 'context.mainExecutor' app/src/main/java; then
            echo 'ERROR: API 28 Context.mainExecutor returned; minSdk must remain 26.'
            exit 1
          fi

